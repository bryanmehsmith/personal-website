name: Deploy to Azure Static Web App

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: 'true'

      - name: Compile tagged resume PDF
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          root_file: resume/resume.tex
          docker_image: ghcr.io/xu-cheng/texlive-alpine@sha256:11383430b9a3e48c0b79339f34d8092f942f897d91ab3749d4899d06731fea7f
          work_in_root_file_dir: true

      - name: Verify and publish resume PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo resume/resume.pdf | grep -Eq '^Tagged:[[:space:]]+yes$'
          cp resume/resume.pdf public/resume.pdf

      - name: Build
        run: npm run build

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'build'
          skip_app_build: true
